<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
        html,
        body{
            width: 100%;
            height: 100%;
        }
        #hud{
            position:fixed;
            top:20px;
            left: 20px;
            z-index: 999;
        }

        button{
            font-size: 18px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <button id="megane1btn">メガネ1</button>
        <button id="megane2btn">メガネ2</button>
        <button id="megane3btn">メガネ3</button>
        <button id="hat1btn">帽子1</button>
    </div>
    <a-scene id="scene" mindar-face embedded>
        <a-entity id="face" mindar-face-target="anchorIndex:168">
            <a-gltf-model
            id="accessory"
            src="megane1.glb"
            position="-0.07 0 -0.1"
            rotation="0 180 0"
            scale="0.7 0.7 0.7"
            >
        </a-gltf-model>
        </a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
        const accessory = document.getElementById("accessory");
        const megane1btn = document.getElementById("megane1btn");
        const megane2btn = document.getElementById("megane2btn");
        const megane3btn = document.getElementById("megane3btn");
        const hat1btn = document.getElementById("hat1btn");

        function toMegane2(){
            accessory.setAttribute("src","megane2.glb");
            accessory.setAttribute("position","0 0 -0.1");
            accessory.setAttribute("rotation","0 0 0");
            accessory.setAttribute("scale","0.55 0.55 0.55");
        }

        megane2btn.addEventListener("click",toMegane2);

        function toMegane1(){
            accessory.setAttribute("src","megane1.glb");
            accessory.setAttribute("position","-0.07 0 -0.1");
            accessory.setAttribute("rotation","0 180 0");
            accessory.setAttribute("scale","0.7 0.7 0.7");
        }
        megane1btn.addEventListener("click",toMegane1)

        function toMegane3(){
            accessory.setAttribute("src","megane3.glb");
            accessory.setAttribute("position","0 0 0");
            accessory.setAttribute("rotation","0 0 0");
            accessory.setAttribute("scale","0.6 0.6 0.6");
        }
        megane3btn.addEventListener("click",toMegane3)

        function tohat1(){
            accessory.setAttribute("src","hat1.glb");
            accessory.setAttribute("position","0 1.5 -3");
            accessory.setAttribute("rotation","0 0 0");
            accessory.setAttribute("scale","1 1 1");
        }
        hat1btn.addEventListener("click",tohat1)
    </script>
</body>
</html>
