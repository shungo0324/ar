<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
    <style>
        #hud{
            position:fixed;
            top:20px;
            left:20px;
            z-index:999;
        }
    </style>
</head>
<body>
        <div id="hud">
            <button id="enlargeButton">拡大</button>
            <button id="shrinkButton">縮小</button>
            <button id="rotateButton">回転</button>
            <button id="reverseButton">逆回転</button>
            <button id="circle1btn">魔法陣１</button>
            <button id="circle2btn">魔法陣２</button>
        </div>
    <a-scene hands>
        <a-entity hand-anchor="index:9">
            <a-gltf-model
            id="circle"
            src="c_rose.glb"
            animation-mixer="clip:MagicCircle_Loop"
            position="0 1 0"
            scale="2 2 2"
        ></a-gltf-model>
        <a-entity hand-anchor="index:9">
            <a-gltf-model
            id="bunny"
            src="Bunny.glb"
            animation-mixer="clip:MagicCircle_Loop"
            position="0 1 0"
            scale="0.3 0.3 0.3"
        ></a-gltf-model>
    </a-scene>
    <script>
        const circle = document.getElementById("circle")
        const circle2btn = document.getElementById("circle2btn")
        const circle1btn = document.getElementById("circle1btn")

        const circleSound = new Audio("circle.mp3")

        const model = document.getElementById("bunny")

        const enlargeButton =document.getElementById("enlargeButton");
        const shrinkButton =document.getElementById("shrinkButton");
        const rotateButton =document.getElementById("rotateButton");
        const reverseButton =document.getElementById("reverseButton");

        let size = 0.3
        let angle = 0;

        function enlargeModel(){
            size = size + 0.1;
            model.setAttribute("scale",`${size} ${size} ${size}`);
        }

        function shrinkModel(){
            size = size -0.1;
            model.setAttribute("scale",`${size} ${size} ${size}`);
        }

        function rotateModel(){
            angle+=15;
            model.setAttribute("rotation",`0  ${angle} 0`)
        }

        function reverseModel(){
            angle-=15;
            model.setAttribute("rotation",`0  ${angle} 0`)
        }

        function changeGlb(){
            circle.setAttribute("src", "c_cyan.glb")
            circleSound.play()
        }

        function backGlb(){
            circle.setAttribute("src", "c_rose.glb")
            circleSound.play()
        }
    
        enlargeButton.addEventListener("click",enlargeModel)
        shrinkButton.addEventListener("click",shrinkModel)
        rotateButton.addEventListener("click",rotateModel)
        reverseButton.addEventListener("click",reverseModel)

        circle2btn.addEventListener("click",changeGlb)
        circle1btn.addEventListener("click",backGlb)
    </script>
</body>
</html>
