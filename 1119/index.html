<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="icon" href="data:,">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-vr-kit@v0.3.0/vr-kit.js"></script>
    <style>
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 999;
        }

        select {
            font-size: 18px;
            padding: 4px 8px;
            width: 200px;
        }
        footer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div id="hud">
        <select name="" id="avatarChoice">
            <option value="robot.glb">ロボット</option>
            <option value="wolf.glb">狼</option>
        </select>
        <p id="countText">0 / 3</p>
        <p id="resultText"></p>
        <p id="time">10秒</p>
    </div>

    <footer>
        <a href="https://poly.pizza/m/dVYNsvgErMo">Maze.0</a>
        by Chuck Leone 
        <a href="https://creativecommons.org/licenses/by/3.0/">CC-BY</a>
        via Poly Pizza
    </footer>

    <a-scene>
        <a-sky color="lightblue"></a-sky>
        <a-entity
        id="map"
        gltf-model="nature.glb"
        position="0 0 0"
        scale = "15 15 15"
        walkable></a-entity>

        <a-entity id="avatar" gltf-model="robot.glb" position="0 0 -3" scale="0.3 0.3 0.3" avatar="
            view:third;
            avatarDirection:180;
            walk: Robot_Walking;
            idle: Robot_Wave;
            cameraFollow:false;
            moveSpeed: 1;
            ">
        </a-entity>

        <a-entity 
        gltf-model="cabin.glb"
        position="-5 -1 -5"
        scale="10 10 10"></a-entity>

        <a-box id="box1" color="gold" position="0 0 -5" solid></a-box>
        <a-box id="box2" color="gold" position="-5 0 0" solid></a-box>
        <a-box id="box3" color="gold" position="5 -1 -10" solid></a-box>
    </a-scene>

    <script>
        const avatar = document.getElementById("avatar");
        const avatarChoice = document.getElementById("avatarChoice");

        const countText = document.getElementById("countText");
        const resultText = document.getElementById("resultText");

        const timetext =document.getElementById("time"); 

        let count = 0;

        let box1Aru = true;
        let box2Aru = true;
        let box3Aru = true;

        let time = 1000;
        let gameend = false;

        const getbox = new Audio("getbox.mp3");
        const clear = new Audio("clear.mp3");

        function changeAvatar() {
            if (avatarChoice.value === "wolf.glb") {
                avatar.setAttribute("gltf-model", avatarChoice.value);
                avatar.setAttribute("scale", "0.5 0.5 0.5");
                avatar.setAttribute(
                    "avatar-motion", {
                    walk: "Gallop",
                    idle: "Idle"
                })
            }

            if (avatarChoice.value === "robot.glb") {
                avatar.setAttribute("gltf-model", avatarChoice.value);
                avatar.setAttribute("scale", "0.3 0.3 0.3");
                avatar.setAttribute(
                    "avatar-motion", {
                    walk: "Robot_Walking",
                    idle: "Robot_Wave"
                })
            }
        }
        avatarChoice.addEventListener("change", changeAvatar);

        const box1 = document.getElementById("box1");
        const box2 = document.getElementById("box2");
        const box3 = document.getElementById("box3");

        function checkBox(){
            if(box1Aru === true && isNear(avatar,box1,1.5)){
                box1Aru = false;
                box1.setAttribute("visible","false");
                count = count+1;
                getbox.play();
            }

            if(box2Aru === true && isNear(avatar,box2,1.5)){
                box2Aru = false;
                box2.setAttribute("visible","false");
                count = count+1;
                getbox.play();
            }

            if(box3Aru === true && isNear(avatar,box3,1.5)){
                box3Aru = false;
                box3.setAttribute("visible","false");
                count = count+1;
                getbox.play();
            }
            countText.textContent = count + " / 3"
            if(count === 3){
                resultText.textContent = "ゲームクリア！"
                avatar.setAttribute("avatar","enabled",false);
                clear.play();
                gameend=true
            }
        }

        function timecount(){
            if(time >0 && gameend === false){
                time=time-1;
            }
            if(time === 0 && gameend === false){
                resultText.textContent = "ゲームオーバー"
                avatar.setAttribute("avatar","enabled",false);
            }
            timetext.textContent = time +"秒"
        }

        setInterval(checkBox,100);
        setInterval(timecount,1000);
    </script>
</body>


</html>
