<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body>
    <a-scene embedded arjs="sourceType:webcam">
        <a-marker preset="hiro">
            <a-box position="0 0.5 -1" color="skyblue" scale="0.3 0.3 0.3"></a-box>
            <a-box position="0 0.5 0" color="red" scale="0.3 0.3 0.3"></a-box>
            <a-box position="0 0.5 1" color="green" scale="0.3 0.3 0.3"></a-box>
            <a-box position="1 0.5 0" color="cyan" scale="0.3 0.3 0.3"></a-box>
            <a-box position="-1 0.5 0" color="magenta" scale="0.3 0.3 0.3"></a-box>
        </a-marker>

        <a-marker preset="kanji">
           <a-entity id=snowman scale="0.5 0.5 0.5">
               <a-sphere
                    position="0 2.4 0"
                    radius="0.7"
                    ></a-sphere>
                    <a-sphere
                    position="0 1 0"
                    ></a-sphere>
                    <a-sphere
                    position="0.25 2.6 0.65"
                    radius="0.05"
                    color="black"
                    ></a-sphere>
                    <a-sphere
                    position="-0.25 2.6 0.65"
                    radius="0.05"
                    color="black"
                    ></a-sphere>
                    <a-box
                    position="0 2.15 0.65"
                    height="0.1"
                    width="0.4"
                    depth="0.1"
                    color="black"
                    ></a-box></a-cone>
           </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
